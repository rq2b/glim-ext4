# GLIM USB GRUB2 Configuration
# Supports standalone boot and Libreboot's external GRUB config handoff.
#
# Current filesystem UUIDs:
#   GLIM    (FAT32): 8581-D498
#   GLIMISO (ext4):  f68a97e5-1e8a-4ff8-bb65-b5b497dd1343
#
# Do not use `probe`: Libreboot's embedded GRUB may not provide it.
# Update the UUIDs below if either filesystem is recreated.

# Set to 1 to enable routine diagnostic output.
set glim_debug=0

function glim_log {
    if [ "$glim_debug" = "1" ]; then
        echo "GLIM: $*"
    fi
}

# Preserve the incoming Libreboot GRUB environment.
set glim_inherited_root=$root
set glim_inherited_prefix=$prefix

glim_log "Starting configuration"
glim_log "Platform: ${grub_platform}; CPU: ${grub_cpu}"
glim_log "Incoming root: ${glim_inherited_root}"
glim_log "Incoming prefix: ${glim_inherited_prefix}"

# Preserve Libreboot's theme behavior for now.
unset theme
terminal_output console

set gfxpayload=keep

# Required modules for this configuration and current filesystems.
insmod regexp
insmod part_msdos
insmod part_gpt
insmod fat
insmod ext2

# Use searches instead of `probe`.
insmod search
insmod search_label
insmod search_fs_uuid
insmod search_fs_file

# Filesystem identifiers for this USB.
set glim_boot_uuid=8581-D498
set glim_iso_uuid=f68a97e5-1e8a-4ff8-bb65-b5b497dd1343
set rootuuid=$glim_iso_uuid
set isopath=/iso

# ------------------------------------------------------------
# Locate the GLIM boot partition
# ------------------------------------------------------------

set glim_boot=

if search --no-floppy --label --set=glim_boot GLIM; then
    glim_log "Boot partition found by label: ${glim_boot}"
else
    glim_log "GLIM label search failed; trying UUID"

    if search --no-floppy --fs-uuid --set=glim_boot "$glim_boot_uuid"; then
        glim_log "Boot partition found by UUID: ${glim_boot}"
    else
        glim_log "UUID search failed; checking inherited root"

        if [ -n "$glim_inherited_root" ]; then
            if [ -f "($glim_inherited_root)/boot/grub/grub.cfg" ]; then
                set glim_boot=$glim_inherited_root
                glim_log "Using inherited root: ${glim_boot}"
            fi
        fi
    fi
fi

if [ -n "$glim_boot" ]; then
    set glim_prefix=($glim_boot)/boot/grub
    glim_log "GLIM config directory: ${glim_prefix}"
else
    echo "ERROR: Could not locate the GLIM boot partition."
    echo "Expected filesystem label GLIM or UUID ${glim_boot_uuid}."
    set glim_prefix=$glim_inherited_prefix
fi

# ------------------------------------------------------------
# Locate the ISO partition
# ------------------------------------------------------------

set glim_iso=

if search --no-floppy --fs-uuid --set=glim_iso "$glim_iso_uuid"; then
    glim_log "ISO partition found by UUID: ${glim_iso}"
else
    glim_log "ISO UUID search failed; trying GLIMISO label"

    if search --no-floppy --label --set=glim_iso GLIMISO; then
        glim_log "ISO partition found by label: ${glim_iso}"
    else
        glim_log "Label search failed; trying path-based fallbacks"

        # Best-effort fallback for this SystemRescue ISO collection.
        if search --no-floppy --file --set=glim_iso \
            /iso/systemrescue/systemrescue-*.iso; then
            glim_log "ISO partition found through SystemRescue fallback: ${glim_iso}"
        fi

        # Support an installation where /iso is on the boot partition.
        if [ -z "$glim_iso" ] && [ -n "$glim_inherited_root" ]; then
            if [ -d "($glim_inherited_root)/iso" ]; then
                set glim_iso=$glim_inherited_root
                glim_log "ISO partition found through inherited root"
            fi
        fi

        # Support a single-partition GLIM layout.
        if [ -z "$glim_iso" ] && [ -n "$glim_boot" ]; then
            if [ -d "($glim_boot)/iso" ]; then
                set glim_iso=$glim_boot
                glim_log "Using single-partition GLIM layout"
            fi
        fi
    fi
fi

if [ -n "$glim_iso" ]; then
    set root=$glim_iso

    if [ "$glim_iso" = "$glim_boot" ]; then
        set rootuuid=$glim_boot_uuid
    else
        set rootuuid=$glim_iso_uuid
    fi

    glim_log "ISO root: ${root}"
    glim_log "rootuuid: ${rootuuid}"
else
    echo "ERROR: Could not locate the ISO partition."
    echo "Expected GLIMISO or UUID ${glim_iso_uuid}."
    echo "ISO menu entries may be unavailable."
    set root=$glim_boot
    set rootuuid=$glim_iso_uuid
fi

glim_log "Boot partition: ${glim_boot}"
glim_log "GLIM prefix: ${glim_prefix}"
glim_log "ISO path: ${isopath}"
glim_log "Final root: ${root}"
glim_log "Final rootuuid: ${rootuuid}"

# Export variables used by distro-specific configs.
export glim_boot
export glim_prefix
export rootuuid
export isopath

# ------------------------------------------------------------
# Helpers used by the distro-specific configurations
# ------------------------------------------------------------

function use {
    echo "Using $1 ..."
}

# Save root and temporarily switch it.
function change_root {
    root_saved="$root"
    root="$1"
}

function restore_root {
    root="$root_saved"
}

# Use loopback without leaving an old (loop) device attached.
function loop {
    if [ -e (loop) ]; then
        loopback -d loop
    fi
    loopback loop "$1"
}

# Compare modification times; use lexical order for ties.
function cmp_mtime_literal {
    if [ "$1" -nt "$2" ]; then
        true
    elif [ "$1" -ot "$2" ]; then
        false
    else
        [ "$1" '<' "$2" ]
    fi
}

# Invoke a callback for ISO files, newest first.
function for_each_sorted {
    set callback="$1"
    shift

    # Discard unmatched filename patterns.
    if [ $# -gt 0 ]; then
        for _ in "$@"; do
            set first="$1"
            shift

            if [ -e "$first" ]; then
                if [ $# -gt 0 ]; then
                    setparams "$@" "$first"
                else
                    setparams "$first"
                fi
            fi
        done
    fi

    if [ $# -eq 0 ]; then
        return
    fi

    while [ $# -gt 2 ]; do
        set best="$1"
        shift

        for _ in "$@"; do
            set next="$1"
            shift

            if cmp_mtime_literal "$next" "$best"; then
                setparams "$@" "$best"
                set best="$next"
            else
                setparams "$@" "$next"
            fi
        done

        "$callback" "$best"
    done

    if [ $# -eq 2 ]; then
        if cmp_mtime_literal "$2" "$1"; then
            setparams "$2" "$1"
        fi

        "$callback" "$1"
        shift
    fi

    "$callback" "$1"
}

# Return success if at least one supplied path exists.
function any_exists {
    if [ $# -gt 0 ]; then
        for isofile in "$@"; do
            if [ -e "$isofile" ]; then
                return 0
            fi
        done
    fi

    return 1
}

# ------------------------------------------------------------
# Menu
# ------------------------------------------------------------

if any_exists ${isopath}/antix/antiX-*.iso; then
    menuentry "antiX >" --class antix {
        configfile "${glim_prefix}/inc-antix.cfg"
    }
fi

if any_exists ${isopath}/arch/archlinux-*.iso; then
    menuentry "Arch Linux >" --class arch {
        configfile "${glim_prefix}/inc-arch.cfg"
    }
fi

if any_exists ${isopath}/artix/artix-*.iso; then
    menuentry "Artix >" --class artix {
        configfile "${glim_prefix}/inc-artix.cfg"
    }
fi

if any_exists ${isopath}/debian/debian-live-*.iso ${isopath}/debian/mini.iso; then
    menuentry "Debian >" --class debian {
        configfile "${glim_prefix}/inc-debian.cfg"
    }
fi

if any_exists ${isopath}/gentoo/*.iso; then
    menuentry "Gentoo >" --class gentoo {
        configfile "${glim_prefix}/inc-gentoo.cfg"
    }
fi

if any_exists ${isopath}/openbsd/*.iso; then
    menuentry "OpenBSD >" --class openbsd {
        configfile "${glim_prefix}/inc-openbsd.cfg"
    }
fi

if any_exists ${isopath}/systemrescue/systemrescue-*.iso; then
    menuentry "SystemRescue >" --class systemrescue {
        configfile "${glim_prefix}/inc-systemrescue.cfg"
    }
fi

if any_exists ${isopath}/void/void-live-*.iso; then
    menuentry "Void >" --class void {
        configfile "${glim_prefix}/inc-void.cfg"
    }
fi

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --class uefi {
        fwsetup
    }
fi

menuentry "Reboot" --class shutdown {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}
