# GLIM USB GRUB2 Configuration
#
# Debug-oriented configuration for both standalone GLIM boot and Libreboot's
# "Search for GRUB2 configuration on external media" route.
#
# IMPORTANT: this USB currently uses these filesystem UUIDs:
#   GLIM    (FAT32): 8581-D498
#   GLIMISO (ext4):  f68a97e5-1e8a-4ff8-bb65-b5b497dd1343
# Libreboot's bundled GRUB module set may not include the `probe` command.
# Do not call `probe` here: GLIM's distro configs need rootuuid, so set it to
# the known UUID of the partition containing the ISO files instead.
# The UUIDs are stable when moving this USB between computers. If you recreate
# either filesystem, update the corresponding value below.

# Preserve incoming values only for diagnostics and fallback detection. Do not
# assume that Libreboot's incoming root or prefix refers to GLIM's filesystem.
set glim_inherited_root=$root
set glim_inherited_prefix=$prefix

echo "========================================"
echo "GLIM: starting configuration"
echo "GRUB platform: '${grub_platform}'"
echo "GRUB CPU: '${grub_cpu}'"
echo "Incoming root: '${glim_inherited_root}'"
echo "Incoming prefix: '${glim_inherited_prefix}'"
echo "========================================"

# Use plain text output during troubleshooting. Do not apply or inherit a GRUB
# theme; this avoids theme/module dependencies while debugging.
unset theme
# terminal_output console

# Preserve the existing payload choice for kernels that use it.
set gfxpayload=keep

# Enable basic syntax and filesystem/device support.
insmod regexp
insmod part_msdos
insmod part_gpt
insmod fat
insmod ext2

# Libreboot's current default module list includes search, search_label,
# search_fs_uuid and search_fs_file, but not probe. These searches are therefore
# used instead of `probe --set=...`.
insmod search
insmod search_label
insmod search_fs_uuid
insmod search_fs_file

# Filesystem UUIDs for THIS USB stick. The ISO partition UUID must be supplied
# to distro initramfs configs such as SystemRescue/Archiso via rootuuid.
set glim_boot_uuid="8581-D498"
set glim_iso_uuid="f68a97e5-1e8a-4ff8-bb65-b5b497dd1343"
set rootuuid="$glim_iso_uuid"
set isopath="/iso"

# Locate the small FAT32 GLIM boot partition by label, not by a device name
# such as hd0 or usb0. Fall back to UUID, then to the incoming root if it really
# contains this GLIM grub.cfg.
set glim_boot=
if search --no-floppy --label --set=glim_boot GLIM; then
  echo "GLIM boot partition found by label: '${glim_boot}'"
else
  echo "WARNING: label search for GLIM failed; trying the known FAT32 UUID."
  if search --no-floppy --fs-uuid --set=glim_boot "$glim_boot_uuid"; then
    echo "GLIM boot partition found by UUID: '${glim_boot}'"
  else
    echo "WARNING: UUID search for GLIM failed; checking incoming root."
    if [ -n "$glim_inherited_root" ]; then
      if [ -f "($glim_inherited_root)/boot/grub/grub.cfg" ]; then
        set glim_boot=$glim_inherited_root
        echo "Using incoming root as GLIM boot partition: '${glim_boot}'"
      fi
    fi
  fi
fi

if [ -n "$glim_boot" ]; then
  # Keep prefix untouched: it may be Libreboot's firmware-resident memdisk.
  # Use glim_prefix explicitly for GLIM's own sub-configurations.
  set glim_prefix=($glim_boot)/boot/grub
  echo "GLIM configuration directory: '${glim_prefix}'"
else
  echo "ERROR: Could not locate GLIM boot partition (label GLIM)."
  echo "Incoming root was '${glim_inherited_root}', incoming prefix was '${glim_inherited_prefix}'."
  # Last-resort path for diagnosis; submenu loading may not work in this case.
  set glim_prefix=$glim_inherited_prefix
fi

# Locate the partition holding /iso. Prefer the exact known UUID (unambiguous),
# then its GLIMISO label. This avoids depending on hdN/usbN device numbering.
set glim_iso=
if search --no-floppy --fs-uuid --set=glim_iso "$glim_iso_uuid"; then
  echo "ISO partition found by UUID: '${glim_iso}'"
else
  echo "WARNING: UUID search for GLIMISO failed; trying the GLIMISO label."
  if search --no-floppy --label --set=glim_iso GLIMISO; then
    echo "ISO partition found by label: '${glim_iso}'"
  else
    echo "WARNING: GLIMISO label search failed; trying path-based fallbacks."

    # If the incoming device itself has /iso, it may already be the ISO
    # partition (or a single-partition GLIM installation).
    if [ -n "$glim_inherited_root" ]; then
      if [ -d "($glim_inherited_root)/iso" ]; then
        set glim_iso=$glim_inherited_root
        echo "ISO partition found through incoming root: '${glim_iso}'"
      fi
    fi

    # Search for a file known to be present on the current collection as a
    # last-resort fallback if filesystem-label searching is unavailable.
    if [ -z "$glim_iso" ]; then
      if search --no-floppy --file --set=glim_iso /iso/systemrescue/systemrescue-13.02-amd64.iso; then
        echo "ISO partition found by the current SystemRescue ISO path: '${glim_iso}'"
      fi
    fi

    # Support a single-partition GLIM stick where /iso is on the GLIM FAT32
    # partition. This branch is not used by the current two-partition layout.
    if [ -z "$glim_iso" ]; then
      if [ -n "$glim_boot" ]; then
        if [ -d "($glim_boot)/iso" ]; then
          set glim_iso=$glim_boot
          echo "Using single-partition GLIM layout: '${glim_iso}'"
        fi
      fi
    fi
  fi
fi

if [ -n "$glim_iso" ]; then
  set root=$glim_iso
  if [ "$glim_iso" = "$glim_boot" ]; then
    set rootuuid=$glim_boot_uuid
    echo "ISO files are on the GLIM boot partition; using its UUID."
  else
    set rootuuid=$glim_iso_uuid
    echo "ISO files are on GLIMISO; using its configured UUID."
  fi
else
  echo "ERROR: Could not locate an ISO partition containing /iso."
  echo "Expected label GLIMISO and UUID '${glim_iso_uuid}'."
  echo "The menu will be shown for diagnosis, but ISO entries may be absent."
  set root=$glim_boot
  set rootuuid=$glim_iso_uuid
fi

echo "Final GLIM boot partition: '${glim_boot}'"
echo "Final GLIM prefix: '${glim_prefix}'"
echo "Final ISO partition/root: '${root}'"
echo "Final rootuuid: '${rootuuid}'"
echo "ISO path: '${isopath}'"

# Export variables required by the distro-specific configuration files.
export glim_boot
export glim_prefix
export rootuuid
export isopath

# Theme intentionally disabled during troubleshooting:
# loadfont unicode
# insmod png
# set theme="${glim_prefix}/themes/invader/theme.txt"
function use {
  echo "Using $1 ..."
}

# Save the original value of $root and set it to $1
function change_root {
  root_saved="$root"
  root="$1"
}

# Restore the value of $root saved by change_root
function restore_root {
  root="$root_saved"
}

# Like 'loopback loop A', but check if (loop) already exists
function loop {
  if [ -e (loop) ]; then loopback -d loop; fi
  loopback loop "$1"
}

# Order by mtime DESC, literal value ASC
function cmp_mtime_literal {
  if [ "$1" -nt "$2" ]; then
    true
  elif [ "$1" -ot "$2" ]; then
    false
  else
    [ "$1" '<' "$2" ]
  fi
}

# Feed a list of isos (by one) to a callback in a sorted manner. The order is
# set by cmp_mtime_literal function. Args: callback iso1 iso2 ..
function for_each_sorted {
  set callback="$1"
  shift

  # The list of isos could contain unmatched patterns. Filter those out.
  if [ $# -gt 0 ]; then
    for _ in "$@"; do
      set first="$1"
      shift

      if [ -e "$first" ]; then
        if [ $# -gt 0 ]; then
          setparams "$@" "$first"
        else
          setparams "$first"
        fi
      fi
    done
  fi

  if [ $# -eq 0 ]; then return; fi

  # Below we loop over the set of iso files, pick the "best" one (in terms of
  # cmp_mtime_literal) in the current set and exclude it from the set before
  # starting the next iteration. When the "best" iso in the current set is
  # found, we feed it to the callback.

  while [ $# -gt 2 ]; do
    set best="$1"
    shift

    for _ in "$@"; do
      set next="$1"
      shift

      if cmp_mtime_literal "$next" "$best"; then
        # next is better
        setparams "$@" "$best"
        set best="$next"
      else
        # next is nothing special
        setparams "$@" "$next"
      fi
    done

    "$callback" "$best"
  done

  if [ $# -eq 2 ]; then
    if cmp_mtime_literal "$2" "$1"; then
      setparams "$2" "$1"
    fi

    "$callback" "$1"
    shift
  fi

  "$callback" "$1"
}

# Check if any of its args is an existing path
function any_exists {
  if [ $# -gt 0 ]; then
    for isofile in "$@"; do
      if [ -e "$isofile" ]; then
        return 0
      fi
    done
  fi

  return 1
}

# Menu!
# We (ab)use 'for' to check for at least one ISO file to show the menu

if any_exists ${isopath}/antix/antiX-*.iso; then
  menuentry "antiX >" --class antix {
    configfile "${glim_prefix}/inc-antix.cfg"
  }
fi

if any_exists ${isopath}/arch/archlinux-*.iso; then
  menuentry "Arch Linux >" --class arch {
    configfile "${glim_prefix}/inc-arch.cfg"
  }
fi

if any_exists ${isopath}/artix/artix-*.iso; then
  menuentry "Artix >" --class artix {
    configfile "${glim_prefix}/inc-artix.cfg"
  }
fi

if any_exists ${isopath}/debian/debian-live-*.iso ${isopath}/debian/mini.iso; then
  menuentry "Debian >" --class debian {
    configfile "${glim_prefix}/inc-debian.cfg"
  }
fi

if any_exists ${isopath}/gentoo/*.iso; then
  menuentry "Gentoo >" --class gentoo {
    configfile "${glim_prefix}/inc-gentoo.cfg"
  }
fi

if any_exists ${isopath}/openbsd/*.iso; then
  menuentry "OpenBSD >" --class openbsd {
    configfile "${glim_prefix}/inc-openbsd.cfg"
  }
fi

if any_exists ${isopath}/systemrescue/systemrescue-*.iso; then
  menuentry "SystemRescue >" --class systemrescue {
    configfile "${glim_prefix}/inc-systemrescue.cfg"
  }
fi

if any_exists ${isopath}/void/void-live-*.iso; then
  menuentry "Void >" --class void {
    configfile "${glim_prefix}/inc-void.cfg"
  }
fi

menuentry ' ' { # Empty line
  true
}

if [ "${grub_platform}" = "efi" ]; then
  menuentry "UEFI Firmware Settings" --class uefi {
    fwsetup
  }
fi
menuentry "Reboot" --class shutdown {
  reboot
}
menuentry "Shutdown" --class shutdown {
  halt
}
