# OpenBSD 7.9 installation images

menuentry "OpenBSD 7.9 amd64 installer" "/openbsd/amd64-openbsd.iso" --class openbsd {
    set isofile="${isopath}/openbsd/amd64-openbsd.iso"
    use "amd64-openbsd.iso"
    loop "${isofile}"
    set root=(loop)
    kopenbsd /7.9/amd64/bsd.rd
}

menuentry "OpenBSD 7.9 i386 installer" "/openbsd/i386-openbsd.iso" --class openbsd {
    set isofile="${isopath}/openbsd/i386-openbsd.iso"
    use "i386-openbsd.iso"
    loop "${isofile}"
    set root=(loop)
    kopenbsd /7.9/i386/bsd.rd
}
